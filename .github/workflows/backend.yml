# Backend : tests -> image GHCR -> déploiement sur le VPS (uniquement si les tests passent).
#
# Secrets requis (Settings > Secrets and variables > Actions > Secrets) :
#   VPS_SSH_KEY        clé privée SSH dédiée au déploiement (pas votre mot de passe)
#   VPS_KNOWN_HOSTS    empreinte du serveur (ssh-keyscan) : évite toute usurpation du VPS
# Variables requises (onglet Variables) :
#   VPS_HOST           ex. 157.173.103.147
#   VPS_USER           ex. garrix
#   VPS_DEPLOY_PATH    ex. /home/garrix/freelanceradar
# Les secrets de l'application (.env : base, JWT, SMTP, Gemini...) restent sur le VPS uniquement.
name: backend

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "n8n/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/freelanceradar-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: freelanceradar
          POSTGRES_USER: freelanceradar
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freelanceradar -d freelanceradar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv ne publie plus d'étiquette majeure (v10) : version complète obligatoire.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations/env.py
      # Sans .env, tests/conftest.py utilise la base de ce service (base dédiée *_test).
      - run: uv run pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "image=${IMAGE,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Clé SSH de déploiement
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          # Configuration GitHub : Settings → Secrets and variables → Actions.
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH; do
            [ -n "${!name}" ] || { echo "::error::Variable $name absente (onglet Variables, pas Secrets)."; exit 1; }
          done
          for name in SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Secret VPS_$name absent (onglet Secrets)."; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copier la configuration
        env:
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" "mkdir -p '$DEPLOY_PATH/n8n/workflows'"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$TARGET:$DEPLOY_PATH/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key n8n/workflows/*.json "$TARGET:$DEPLOY_PATH/n8n/workflows/"
      - name: Déployer
        env:
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" bash -s -- "$DEPLOY_PATH" "$BACKEND_IMAGE" <<'EOF'
          set -euo pipefail
          cd "$1"
          test -f .env || { echo "Fichier .env absent sur le serveur." >&2; exit 1; }
          # L'image déployée est mémorisée : un « docker compose up » manuel la réutilise.
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=$2#" .env
          else
            printf 'BACKEND_IMAGE=%s\n' "$2" >> .env
          fi
          docker compose -f docker-compose.prod.yml pull --quiet
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' freelanceradar-api-1 2>/dev/null || true)
            [ "$status" = healthy ] && { echo "API en bonne santé ($2)"; exit 0; }
            sleep 4
          done
          echo "L'API n'est pas devenue « healthy »." >&2
          docker compose -f docker-compose.prod.yml logs --tail=50 api migrate >&2
          exit 1
          EOF
