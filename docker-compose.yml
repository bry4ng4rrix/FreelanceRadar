# Backend complet en une commande : `docker compose up -d --build`.
#
# Ordre de démarrage : postgres + redis (healthy) -> migrate (alembic upgrade head, une fois)
# -> api, worker et beat. Les ports sont liés à 127.0.0.1 uniquement : PostgreSQL et Redis
# ne doivent jamais être exposés publiquement (en production, l'API passe par un reverse proxy).
name: freelanceradar

# Configuration commune aux services du backend (même image, commande différente).
x-backend: &backend
  build:
    context: ./backend
  image: freelanceradar-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    # Dans le réseau Docker, les services se joignent par leur nom (et non 127.0.0.1).
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  networks: [internal]

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Migrations : s'exécute une fois à chaque `up`, avant l'API et les workers.
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Une seule instance de Beat : ne jamais la mettre à l'échelle (collectes en double).
  beat:
    <<: *backend
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Import (et activation) du workflow quotidien avant le démarrage de n8n. Idempotent.
  n8n-import:
    image: n8nio/n8n:2.45.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/workflows/daily-collection.json &&
        n8n publish:workflow --id=frCollecteQuotidienne
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans .env}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Indian/Antananarivo}
      TZ: ${N8N_TIMEZONE:-Indian/Antananarivo}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Le workflow lit l'URL et le jeton via $env. Ce conteneur ne reçoit aucun autre secret
      # du backend (pas de mot de passe de base, SMTP ou Gemini).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Lus par le workflow ($env) : API sur le réseau Docker interne, jeton de service.
      FREELANCERADAR_API_URL: http://api:8000
      FREELANCERADAR_SERVICE_TOKEN: ${SERVICE_API_TOKEN:?SERVICE_API_TOKEN manquant dans .env}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.45.1
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  internal:
